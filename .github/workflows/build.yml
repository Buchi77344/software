name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --name cbt_launcher --collect-all django --collect-all whitenoise --collect-submodules base --collect-submodules admins --hidden-import=waitress --hidden-import=cbt.wsgi --hidden-import=base --hidden-import=base.apps --hidden-import=base.models --hidden-import=admins --hidden-import=admins.apps --hidden-import=admins.models --hidden-import=whitenoise --hidden-import=whitenoise.middleware --add-data "base/templates;templates" --add-data "base/static;static" launcher.py

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cbt-windows-build
          path: dist/