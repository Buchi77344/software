name: Build Windows EXE

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Show project files
        run: |
          dir
          if exist cbt dir cbt
          if exist templates dir templates
          if exist static dir static

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller waitress
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile ^
            --name cbt_launcher ^
            --collect-all django ^
            --hidden-import=waitress ^
            --hidden-import=cbt.wsgi ^
            --add-data "templates;templates" ^
            --add-data "static;static" ^
            launcher.py

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cbt-windows-build
          path: dist/
